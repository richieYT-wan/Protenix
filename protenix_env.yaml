# Conda environment for running Protenix pipeline

name: protenix_test

channels:
  - pyg
  - conda-forge
  - nvidia
  - rosettacommons # For pyrosetta
  - defaults
  - bioconda

dependencies:
  # --- Core ---
  - python=3.12
  - pip
  - pandas
  - gcsfs
  - fsspec
  - google-cloud-storage
  - frozendict
  # --- Bioinformatics & Cheminformatics ---
  - biopython
  - biotite
  - py3dmol
  - mmseqs2
  - hmmer
  - anarci
  - tmtools # Used for TM score / RMSD and alignment and other utils
  - pymol-open-source # For alignment and RMSD and other utils
  - tqdm 

  # --- Pip-installed packages ---
  - pip:
    - colabfold[alphafold]
    - protenix
    - abnumber
    - shape-complementarity
    - "-e git+ssh://git@github.com/servier-github/ab-develop.git@develop#subdirectory=projects/uc_denovo_vhh/foldlab&egg=foldlab"


